name: Make lecture video

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path of your notes, e.g. notes/lecture1.pdf"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the notes file exists
        env:
          NOTES: ${{ github.event.inputs.file }}
        run: |
          if [ ! -f "$NOTES" ]; then
            echo "Could not find the file: $NOTES"
            echo "Files in the notes folder:"
            ls -la notes || true
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          sudo apt-get install -y fonts-comic-neue || true
          pip install -r requirements.txt

      - name: Make the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTES: ${{ github.event.inputs.file }}
        run: |
          mkdir -p out
          python make_video.py "$NOTES"

      - name: Publish to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" out/*.mp4 \
            --title "Lecture video ${{ github.run_number }}" \
            --notes "Taught by Professor Hoot."
